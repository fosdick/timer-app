# Screenshot tour — drives the real app and captures each key screen.
# NOT a pass/fail test: the asserts/waits are sync points so each screenshot is
# taken once the screen has actually rendered. Run via scripts/screenshots.sh.
#
# Taps go through testIDs, NOT visible text: tapping text by coordinates proved
# unreliable (the Start tap silently no-op'd after a UI redesign — see the repo's
# tab/center-icon testIDs for the same reason). Buttons:
#   breath-start-stop · yoga-start-stop · yoga-center-icon · tab-{pranayama,yoga,hitt}
# After pressing Start we wait for "Stop" to appear before screenshotting, which
# both confirms the press registered and avoids racing the re-render.
appId: com.example.timer-app
---
# --- Pranayama (idle) ---
- launchApp:
    clearState: true          # fresh state -> deterministic content on every device
- extendedWaitUntil:          # absorb cold-launch + splash before the first shot
    visible: "Start"
    timeout: 30000
- takeScreenshot: "01-pranayama-idle"

# --- Pranayama (count-in "Begin in" if enabled, else the running state) ---
- tapOn:
    id: "breath-start-stop"
- extendedWaitUntil:          # press registered -> button flips to Stop (count-in or running)
    visible: "Stop"
    timeout: 12000
- takeScreenshot: "02-pranayama-countin"
- tapOn:
    id: "breath-start-stop"   # Stop: cancels the count-in / stops the session

# --- Yoga (idle) ---
- tapOn:
    id: "tab-yoga"
- extendedWaitUntil:
    visible:
      id: "yoga-start-stop"
    timeout: 15000
- takeScreenshot: "03-yoga-idle"

# --- Yoga (running) ---
- tapOn:
    id: "yoga-start-stop"
- extendedWaitUntil:
    visible: "Stop"
    timeout: 12000
- takeScreenshot: "04-yoga-running"

# --- Yoga Paces ---
- tapOn:
    id: "yoga-center-icon"    # center pose icon opens the Paces list
- assertVisible: "Paces"      # modal header
- takeScreenshot: "05-yoga-paces"
- tapOn: "Done"               # close the modal
- tapOn:
    id: "yoga-start-stop"     # stop the yoga timer before leaving the tab

# --- HIIT (idle) ---
- tapOn:
    id: "tab-hitt"
- extendedWaitUntil:
    visible: "Start"
    timeout: 15000
- takeScreenshot: "06-hitt-idle"

# --- User Preferences (colour themes + pronoun) ---
# Deep link, not the account menu. The menu renders in a React Native <Modal>,
# which iOS puts in its own window, and Maestro can read NOTHING out of it — not
# the testIDs, and not the text either. Verified twice against failure
# screenshots: the menu was open with both items plainly visible while both
# `id: menu-user-preferences` and `"App Settings"` failed to resolve.
# expo-router serves the route directly, which skips the whole problem.
- openLink: myapp://user-preferences
- tapOn:
    # iOS interposes an "Open in <app>?" system alert on a scheme link opened from
    # outside the app. It is a UIAlertController, not an RN Modal, so Maestro can
    # see it. optional: in case a future iOS stops prompting.
    text: "Open"
    optional: true
- extendedWaitUntil:
    # The chip's accessibilityLabel, not the visible text: the label overrides the
    # inner <Text> in the accessibility tree, so a bare "Golden Sun" does not
    # match. Only this screen has it.
    visible: "Golden Sun colour theme"
    timeout: 15000
- takeScreenshot: "07-preferences"
